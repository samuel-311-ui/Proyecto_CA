<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pronóstico de consumo</title>
<link rel="stylesheet" href="/static/styles.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/static/app.js" defer></script>
</head>
<body>

<header>
  <h1>Pronóstico de consumo eléctrico<span class="tag-demo" id="tagDemo">modelo demo</span></h1>
  <p id="subtitulo">Modelo SARIMA con datos de influxDB</p>
  <p class="autor">Samuel Zapata · Computación Avanzada</p>
</header>

<main>
  <form class="controles" id="controles">
    <label>Horas a pronosticar
      <select id="horas">
        <option value="6">6 horas</option>
        <option value="12" selected>12 horas</option>
        <option value="24">24 horas</option>
        <option value="48">48 horas</option>
        <option value="72">72 horas</option>
      </select>
    </label>
    <label>Historia a mostrar
      <select id="historia">
        <option value="24">últimas 24 h</option>
        <option value="48" selected>últimas 48 h</option>
        <option value="96">últimas 96 h</option>
        <option value="168">últimos 7 días</option>
      </select>
    </label>
    <label>Confianza del intervalo
      <select id="confianza">
        <option value="0.8">80 %</option>
        <option value="0.9">90 %</option>
        <option value="0.95" selected>95 %</option>
        <option value="0.99">99 %</option>
      </select>
    </label>
    <button type="submit" id="btn">Actualizar</button>
    <span id="estado"></span>
  </form>

  <div id="error"></div>

  <div id="resultado">
    <section class="indicadores" id="indicadores"></section>

    <section class="caja">
      <h2>Histórico y pronóstico</h2>
      <div class="grafica"><canvas id="lienzo"></canvas></div>
    </section>

    <section class="caja">
      <h2>Detalle del pronóstico</h2>
      <table>
        <thead>
          <tr><th>Hora (Colombia)</th><th>Predicción</th><th>Límite inferior</th><th>Límite superior</th></tr>
        </thead>
        <tbody id="filas"></tbody>
      </table>
    </section>
  </div>

  <details id="detModelo">
    <summary>Sobre el modelo</summary>
    <dl id="datosModelo"><dt>Estado</dt><dd>cargando…</dd></dl>
  </details>
</main>

<footer id="pie"></footer>

<script src="/static/app.js"></script>
</body>
</html>
